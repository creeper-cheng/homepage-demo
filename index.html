<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>creeper-cheng 的空间</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 24px;
      line-height: 1.5;
      margin-bottom: 16px;
      color: #4a3f8a;
    }

    p {
      line-height: 1.8;
      color: #666;
      margin-bottom: 28px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 14px 36px;
      font-size: 16px;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active { transform: translateY(0); }

    h1 .floor {
      display: inline-block;
      min-width: 1.3em;
      text-align: center;
      font-size: 1.15em;
      color: #764ba2;
    }

    h1 .floor.pop {
      animation: pop 0.25s ease;
    }

    @keyframes pop {
      50% { transform: scale(1.3); }
    }

    .floor-nav {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .floor-nav button {
      padding: 12px 28px;
      font-size: 15px;
    }

    .floor-form {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }

    .floor-form input {
      width: 132px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 15px;
      color: #4a3f8a;
      text-align: center;
      background: #f7f6fc;
      border: 2px solid #e6e3f5;
      border-radius: 999px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
      appearance: textfield;
    }

    .floor-form input:focus {
      background: #fff;
      border-color: #764ba2;
    }

    .floor-form input::placeholder { color: #b3aec9; }

    .floor-form input::-webkit-outer-spin-button,
    .floor-form input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .floor-form button {
      padding: 12px 24px;
      font-size: 15px;
    }

    .tip {
      margin: 14px 0 0;
      min-height: 18px;
      font-size: 13px;
      color: #d9534f;
    }

    .hint {
      margin: 16px 0 0;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>欢迎来到 creeper-cheng 的空间，这里是第 <span class="floor" id="floor">30</span> 层</h1>
    <p>这是一个用纯 HTML + CSS + JavaScript 写的简单网页。<br>用下面的按钮切换楼层试试看。</p>
    <div class="floor-nav">
      <button id="up">上一层</button>
      <button id="down">下一层</button>
    </div>
    <form class="floor-form" id="floor-form">
      <input id="floor-input" type="number" min="1" inputmode="numeric" placeholder="输入楼层号" aria-label="输入要跳转的楼层号">
      <button type="submit">跳转</button>
    </form>
    <p class="tip" id="tip" role="status"></p>
    <p class="hint">也可以在网址后面加 <code>#42</code>，直接跳到第 42 层</p>
  </div>

  <script>
    const DEFAULT_FLOOR = 30;  // 默认楼层，改这个数字即可
    const MIN_FLOOR = 1;       // 最低层数，不想限制就改成 -Infinity

    const floorEl = document.getElementById('floor');

    // 优先读取网址里的 #数字，例如 index.html#42
    function readFloorFromHash() {
      const n = parseInt(location.hash.slice(1), 10);
      return Number.isInteger(n) && n >= MIN_FLOOR ? n : DEFAULT_FLOOR;
    }

    let floor = readFloorFromHash();

    function render() {
      floorEl.textContent = floor;
      // 重启一次动画，让数字变化时有弹跳效果
      floorEl.classList.remove('pop');
      void floorEl.offsetWidth;
      floorEl.classList.add('pop');
    }

    // 跳到指定楼层，成功返回 true
    function setFloor(next) {
      if (!Number.isInteger(next) || next < MIN_FLOOR) return false;
      floor = next;
      history.replaceState(null, '', '#' + floor);
      render();
      return true;
    }

    function go(delta) {
      setFloor(floor + delta);
    }

    document.getElementById('up').addEventListener('click', () => go(1));
    document.getElementById('down').addEventListener('click', () => go(-1));

    // 输入框跳转
    const form = document.getElementById('floor-form');
    const input = document.getElementById('floor-input');
    const tip = document.getElementById('tip');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const n = parseInt(input.value, 10);

      if (!Number.isInteger(n)) {
        tip.textContent = '请先输入一个楼层号，比如 42';
        return;
      }
      if (!setFloor(n)) {
        tip.textContent = `楼层号不能小于 ${MIN_FLOOR}`;
        return;
      }

      tip.textContent = '';
      input.value = '';
      input.blur();
    });

    render();
  </script>
</body>
</html>
